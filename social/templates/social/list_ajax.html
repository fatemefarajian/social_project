{% if tag %}
<h2>posts tagged with "{{tag.name}}"</h2>
{% endif %}
<div class="post-list">{% for post in posts %}
 {% if post.images.count > 0 %}
        <img src="{{post.images.first.image_file.url}}" alt="{{post.images.first.title}}" style="width: 450px ; height: 300px">
        {% endif %}
<br>

<h3><a href="{{ post.get_absolute_url }}">{{ post.description|truncatewords:5 }}</a></h3>
<p>by:{{post.author}}</p>

    {% for tag in post.tags.all %}
    <a href="{% url 'social:post_list_by_tag' tag.slug %}">{{tag.name}}</a>
    {% if not forloop.last %}, {% endif %}
    {% endfor %}
<br>
<hr>
{% endfor %}
</div>
