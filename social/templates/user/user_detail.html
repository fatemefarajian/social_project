{% load thumbnail %}
{% load static %}

{{user.get_full_name}}
<button type="submit">follow/unfollow</button>
{% if user.photo %}
<a href="{{ user.photo.url }}">
    <img src="{% thumbnail user.photo 200x200 quality=80 %}">
    {% else %}
    <img src="{% static 'images/profile/avatar-15-512.png' %}" style="width: 200px">
</a>
{% endif %}
{% with total_followers=user.follower.count  total_following=user.following.count%}
    <p>{{total_followers}} follower {{total_followers | pluralize }}</p>
    <p>{{total_following}} following</p>
{% endwith %}
