<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List</title>
</head>
<body>
<h1>پست ها</h1>
{% if tag %}
<h2>posts tagged with{{tag.name}}</h2>
{% endif %}
{% for post in posts %}
<h3><a href="{{ post.get_absolute_url }}">{{ post.description|truncatewords:5 }}</a></h3>
<p>by:{{post.author}}</p>
    {% for tag in post.tags.all %}
    <a href="{% url 'social:post_list_by_tag' tag.slug %}">{{tag.name}}</a>
    {% if not forloop.last %}, {% endif %}
    {% endfor %}
<br>
{% endfor %}
</body>
</html>
